[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "himdex"
version = "0.6.0"
description = "Efficient multimodal Transformer for text and image learning."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Gading" }
]
keywords = ["machine-learning", "multimodal", "transformer", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "pillow>=10.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66"
]

[project.optional-dependencies]
data = [
  "datasets>=2.20",
  "kaggle>=1.6"
]
benchmark = [
  "joblib>=1.3",
  "scipy>=1.10",
  "scikit-learn>=1.4"
]
dev = [
  "build>=1.2",
  "joblib>=1.3",
  "pytest>=8.0",
  "scipy>=1.10",
  "scikit-learn>=1.4"
]

[project.urls]
Homepage = "https://github.com/dexpie/himdex"
Repository = "https://github.com/dexpie/himdex"
Issues = "https://github.com/dexpie/himdex/issues"

[project.scripts]
himdex-prepare-data = "himdex.prepare_datasets:main"
himdex-pretrain-text = "himdex.pretrain_text:main"
himdex-train = "himdex.train:main"
himdex-embed = "himdex.inference:main"
himdex-benchmark-tfidf = "himdex.benchmark_tfidf:main"
himdex-benchmark-hybrid = "himdex.benchmark_hybrid:main"
himdex-hybrid = "himdex.hybrid_model:main"

[tool.setuptools.packages.find]
where = ["src"]
